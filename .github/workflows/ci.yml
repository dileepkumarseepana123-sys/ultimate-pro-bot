name: T20 Scanner CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile scanner
        run: python -m py_compile scanner.py

      - name: Compile smoke test
        run: |
          python - <<'PY'
          import scanner
          assert scanner.is_standard_t20({"matchType": "t20"}) is True
          assert scanner.is_standard_t20({"matchType": "odi"}) is False
          assert scanner.is_standard_t20({"name": "Team A vs Team B", "series_name": "Caribbean Premier League 2026"}) is True
          print("T20 filter smoke tests passed")
          PY
