name: Match Deep Intel Scanner

on:
  schedule:
    - cron: '30 18 * * *' # 18:30 UTC = Exactly 12:00 AM Midnight IST
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Requirements
        run: pip install requests beautifulsoup4
        
      - name: Run Bot (Scrape & Analyze)
        run: python scanner.py
        
      - name: Save intel.json to Repo
        run: |
          git config --global user.name "Scanner-Bot"
          git config --global user.email "bot@ultimatepro.com"
          git add intel.json
          git commit -m "Auto-updated deep match intel" || exit 0
          git push
          
    - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright playwright-stealth
          playwright install chromium --with-deps
