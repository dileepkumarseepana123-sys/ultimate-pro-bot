name: Match Deep Intel Scanner

on:
  push:
    branches: [main]
    paths:
      - 'scanner.py'
  schedule:
    - cron: '30 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: match-deep-intel-scanner
  cancel-in-progress: false

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CRICKETDATA_API_KEY: ${{ secrets.CRICKETDATA_API_KEY }}
      SCANNER_LOOKAHEAD_DAYS: '1'
      TODAY_ONLY: '1'
      MIN_VENUE_MATCHES: '5'
      MIN_SPIN_CLASSIFICATION: '0.90'
      XI_LOOKAHEAD_MIN: '180'
      ALLOW_FANTASY_SQUAD: '0'
      MAX_XI_LOOKUPS_PER_RUN: '0'
      MAX_MATCH_PAGES_PER_RUN: '2'
      PAUSE_UNTIL_IST: '2026-09-21'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Cache Cricsheet Data
        uses: actions/cache@v4
        with:
          path: data
          key: cricsheet-${{ runner.os }}-${{ hashFiles('scanner.py', 'config/spin_bowlers.json') }}
          restore-keys: |
            cricsheet-${{ runner.os }}-

      - name: Run T20 Scanner
        run: python scanner.py

      - name: Save intel.json
        run: |
          git config user.name "Scanner-Bot"
          git config user.email "bot@ultimatepro.com"

          # Preserve generated outputs, move the checkout to the latest main,
          # then apply only the generated files. This avoids rebase conflicts
          # when scanner.py or the dashboard changes while a scan is running.
          cp intel.json /tmp/intel.json
          if [ -f intel_last_good.json ]; then cp intel_last_good.json /tmp/intel_last_good.json; fi
          if [ -f pre_match_archive.json ]; then cp pre_match_archive.json /tmp/pre_match_archive.json; fi

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/intel.json intel.json
          if [ -f /tmp/intel_last_good.json ]; then cp /tmp/intel_last_good.json intel_last_good.json; fi
          if [ -f /tmp/pre_match_archive.json ]; then cp /tmp/pre_match_archive.json pre_match_archive.json; fi

          git add intel.json
          if [ -f intel_last_good.json ]; then git add intel_last_good.json; fi
          if [ -f pre_match_archive.json ]; then git add pre_match_archive.json; fi
          git diff --cached --quiet && exit 0
          git commit -m "Auto-update T20 deep match intel"
          git push origin main
