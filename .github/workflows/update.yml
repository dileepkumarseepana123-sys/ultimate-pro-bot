name: Match Deep Intel Scanner

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CRICKETDATA_API_KEY: ${{ secrets.CRICKETDATA_API_KEY }}
      SCANNER_LOOKAHEAD_DAYS: '1'
      TODAY_ONLY: '1'
      MIN_VENUE_MATCHES: '5'
      MIN_SPIN_CLASSIFICATION: '0.90'
      XI_LOOKAHEAD_MIN: '180'
      ALLOW_FANTASY_SQUAD: '0'
      MAX_XI_LOOKUPS_PER_RUN: '0'
      MAX_MATCH_PAGES_PER_RUN: '2'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Cache Cricsheet Data
        uses: actions/cache@v4
        with:
          path: data
          key: cricsheet-${{ runner.os }}-${{ hashFiles('scanner.py', 'config/spin_bowlers.json') }}
          restore-keys: |
            cricsheet-${{ runner.os }}-

      - name: Run T20 Scanner
        run: python scanner.py

      - name: Save intel.json
        run: |
          git config user.name "Scanner-Bot"
          git config user.email "bot@ultimatepro.com"
          git add intel.json
          git diff --cached --quiet && exit 0
          git commit -m "Auto-update T20 deep match intel"
          git push
